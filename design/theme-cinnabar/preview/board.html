<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pastable · 中国潮色 · 对比</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1512px; background: #0B0A09; }
  body {
    font-family: "PingFang SC", "SF Pro Text", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 48px 0 56px;
  }
  .wrap { width: 1512px; margin: 0 auto; }
  .eyebrow {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 1.4px;
    color: #8E867D;
    margin: 0 0 14px 64px;
  }
  h1 {
    font-family: "Songti SC", "STSong", serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.15;
    color: #F6F1EA;
    margin: 0 0 10px 60px;
    letter-spacing: 2px;
  }
  .sub {
    font-size: 14px;
    color: #ACA49B;
    margin: 0 0 44px 64px;
  }
  .sub b { color: #E0523B; font-weight: 600; }
  .caption {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 1.2px;
    color: #8E867D;
    margin: 0 0 10px 64px;
  }
  .panel { display: block; width: 1512px; height: 325px; }
  .gap { height: 34px; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">PASTABLE · UI 2026 / THEME PROPOSAL</p>
    <h1>中国潮色 · 朱砂</h1>
    <p class="sub">CINNABAR <b>#C8402E</b> &nbsp;·&nbsp; 以美图「中国潮色」为锚点，重映射面板、卡片与分类色</p>

    <p class="caption">DARK · 墨色</p>
    <img class="panel" src="panel-dark.png" alt="Dark panel">
    <div class="gap"></div>
    <p class="caption">LIGHT · 宣纸</p>
    <img class="panel" src="panel-light.png" alt="Light panel">
  </div>
</body>
</html>
