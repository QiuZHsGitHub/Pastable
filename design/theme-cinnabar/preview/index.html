  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'light' ? 'light' : 'dark';
  const t = TOKENS.themes[mode];

  const v = (x) => (x && typeof x === 'object' && '$value' in x) ? x.$value : x;
  const hex = (value) => String(v(value)).replace('#', '');
  const rgb = (value) => {
    const h = hex(value);
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const rgba = (value, alpha) => {
    const [r, g, b] = rgb(value);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  };
  const mix = (a, b, ratio) => {
    const A = rgb(a); const B = rgb(b);
    const c = A.map((x, i) => Math.round(x * ratio + B[i] * (1 - ratio)));
    return '#' + c.map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  };

  const panelMid = v(t.surface.panel.mid);
  const panelBottom = v(t.surface.panel.bottom);
  const panelBorder = v(t.surface.panel.border);

    { label: '媒体', dot: v(cat.media) }

    code: v(cat.code),
    color: v(cat.color),
    link: v(cat.link),
    text: v(cat.text)

    { kind: 'color', tint: pills.color, label: '颜色', detail: '7 字' },
    { kind: 'link', tint: pills.link, label: '链接', detail: '40 字' },
    { kind: 'text', tint: pills.text, label: '文本', detail: '21 字' },
    { kind: 'code2', tint: pills.code, label: '代码', detail: '24 字' }

    const bg = tab.selected ? v(t.control.tab.selectedBackground) : v(t.control.tab.background);
    const border = tab.selected ? accent : v(t.control.tab.border);
    const color = tab.selected ? v(t.control.tab.textSelected) : v(t.control.tab.text);
    return `<div class="tab" style="background:${bg};border-color:${border};color:${color};font-weight:${tab.selected ? 600 : 400}">

    </div>`;
  }).join('');

        return `<div class="content"><div class="code" style="color:${body}">func greet(name: String) {<br>&nbsp;&nbsp;print("你好，\\(name)")<br>}</div></div>`;
      case 'color':
        return `<div class="content"><div class="swatch" style="background:${v(cat.color)}"><span class="chip">${v(cat.color).toUpperCase()}</span></div></div>`;
      case 'link':
        return `<div class="content"><div class="bodytext" style="color:${body}">https://github.com/QiuZHsGitHub/Pastable</div></div>`;
      default:
        return `<div class="content"><div class="bodytext" style="color:${body}">下午三点评审「中国潮色」主题，<br>记得带上色卡和充电器。</div></div>`;
    }
  };

  const renderCard = (card) => {
    const base = v(t.surface.card.base);
    const ratio = v(card.selected ? t.card.tint.selected : t.card.tint.normal);
    const top = mix(card.tint, base, ratio);
    const border = card.selected ? accent : v(t.surface.card.border);
    const width = card.selected ? 1.5 : 1;
    const shadows = [];
    if (card.selected) shadows.push(`0 0 18px ${rgba(accent, v(t.accent.glow))}`);
    shadows.push(`0 10px 18px rgba(0, 0, 0, ${mode === 'dark' ? 0.26 : 0.09})`);
    shadows.push(`0 4px 6px rgba(0, 0, 0, ${mode === 'dark' ? 0.14 : 0.05})`);
    return `<div class="card" style="background:linear-gradient(180deg, ${top} 0%, ${base} 100%);border-color:${border};border-width:${width}px;box-shadow:${shadows.join(',')}">
      ${renderBody(card)}
      <div class="footer">
        <span class="appicon">P</span>
        <span class="time" style="color:${v(t.text.secondary)}">21 分钟前</span>
        <span class="detail" style="color:${v(t.text.tertiary)}">${card.detail}</span>
        <span class="pill" style="background:${v(t.control.pill.background)};color:${v(t.control.pill.text)}">
          <i style="background:${card.tint}"></i>${card.label}
        </span>
      </div>
    </div>`;
  };

  document.getElementById('root').innerHTML = `<div class="panel" style="background:linear-gradient(180deg, ${panelTop} 0%, ${panelMid} 16%, ${panelBottom} 100%);border-color:${panelBorder}">
    <div class="header">
      <div class="tabs">${renderTabs()}</div>
      ${renderSearch()}
    </div>
    <div class="cards">${cards.map(renderCard).join('')}</div>
  </div>`;
</script>
</body>
</html>
