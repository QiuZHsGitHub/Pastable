<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Pastable · App Store screenshot 02 (zh-Hant)</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body class="hant collection">
<div class="stage">
  <div class="watermark" aria-hidden="true">P</div>

  <div class="brand">
    <img src="../../Pastable/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png" alt="">
    <span>Pastable</span><span>MACOS</span>
  </div>

  <div class="copy">
    <p class="eyebrow">一條都沒丟 · 5 類內容自動辨識</p>
    <h1>一條都沒丟。</h1>
    <p class="sub">文字、程式碼、連結、圖片、檔案，複製進來就自動分好類。搜到一個詞，就能把任何一條找回來。</p>
    <div class="chips">
      <span class="chip text"><i></i>文字</span>
      <span class="chip code"><i></i>程式碼</span>
      <span class="chip link"><i></i>連結</span>
      <span class="chip media"><i></i>圖片</span>
      <span class="chip file"><i></i>檔案</span>
    </div>
    <div class="keys" style="margin-top:40px;">
      <span class="key">⌘</span><span class="key">⇧</span><span class="key">F</span>
      <span class="key-text">直接搜全文</span>
    </div>
  </div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-hant-light.png" alt="">
  </div>
</div>
</body>
</html>
