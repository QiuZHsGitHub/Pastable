<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pastable · App Store screenshot 01</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body>
<div class="stage">
  <div class="brand">
    <img src="../../Pastable/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png" alt="">
    <span>Pastable</span><span>MACOS</span>
  </div>

  <div class="copy">
    <p class="eyebrow">PASTABLE · MACOS 剪贴板浮层</p>
    <h1>呼出即贴，<br><em>不打断手头工作。</em></h1>
    <p class="sub">全屏宽的底部浮层，覆盖在任意 App 之上。<br>打开时不抢键盘焦点，<b>输入继续留给你正在写的那一页</b>。</p>
    <span class="pill"><i></i>不抢焦点 · 光标不丢</span>
    <div class="keys">
      <span class="key">⌘</span><span class="key">⇧</span><span class="key">V</span>
      <span class="key-text">随时呼出</span>
    </div>
  </div>

  <div class="doc">
    <div class="doc-bar">
      <span class="traffic"><i></i><i></i><i></i></span>
      <span class="doc-name">Q4 发布计划.md</span>
      <span class="doc-state"><i></i>已保存</span>
    </div>
    <div class="doc-body">
      <p class="doc-kicker">Q4 LAUNCH / DRAFT 03</p>
      <p class="doc-h">发布计划</p>
      <div class="doc-rule"></div>
      <p class="doc-p">把桌面端剪贴板的使用路径，缩短到<b>一次呼出</b>。用户不必先理解产品概念，只需要知道：按一下快捷键，最近复制的东西就从屏幕底部出现。</p>
      <p class="doc-p" style="margin-top:14px;"><strong>本周</strong></p>
      <ul class="doc-list">
        <li class="done">首屏文案：不打断手头工作</li>
        <li>周四前提交 1.2.1</li>
      </ul>
      <p class="doc-p" style="margin-top:14px;"><span class="typed">备注：发布前再跑一遍 3 秒测试。</span><span class="caret"></span></p>
    </div>
  </div>

  <div class="callout"><i></i>键盘焦点还在这里</div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-dark.png" alt="">
  </div>
</div>
</body>
</html>
