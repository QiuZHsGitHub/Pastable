<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pastable · App Store screenshot 02</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body class="collection">
<div class="stage">
  <div class="watermark" aria-hidden="true">P</div>

  <div class="brand">
    <img src="../../Pastable/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png" alt="">
    <span>Pastable</span><span>MACOS</span>
  </div>

  <div class="copy">
    <p class="eyebrow">一条都没丢 · 5 类内容自动识别</p>
    <h1>一条都没丢。</h1>
    <p class="sub">文本、代码、链接、图片、文件，复制进来就自动分好类。搜到一个词，就能把任何一条找回来。</p>
    <div class="chips">
      <span class="chip text"><i></i>文本</span>
      <span class="chip code"><i></i>代码</span>
      <span class="chip link"><i></i>链接</span>
      <span class="chip media"><i></i>图片</span>
      <span class="chip file"><i></i>文件</span>
    </div>
    <div class="keys" style="margin-top:40px;">
      <span class="key">⌘</span><span class="key">⇧</span><span class="key">F</span>
      <span class="key-text">直接搜全文</span>
    </div>
  </div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-light.png" alt="">
  </div>
</div>
</body>
</html>
