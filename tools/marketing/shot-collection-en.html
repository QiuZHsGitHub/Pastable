<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pastable · App Store screenshot 02 (EN)</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body class="en collection">
<div class="stage">
  <div class="watermark" aria-hidden="true">P</div>

  <div class="brand">
    <img src="../../Pastable/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png" alt="">
    <span>Pastable</span><span>MACOS</span>
  </div>

  <div class="copy">
    <p class="eyebrow">NOTHING GETS LOST · 5 CONTENT TYPES</p>
    <h1>Nothing gets lost.</h1>
    <p class="sub">Text, code, links, images and files are sorted automatically. One keyword brings any of them back.</p>
    <div class="chips">
      <span class="chip text"><i></i>Text</span>
      <span class="chip code"><i></i>Code</span>
      <span class="chip link"><i></i>Links</span>
      <span class="chip media"><i></i>Images</span>
      <span class="chip file"><i></i>Files</span>
    </div>
    <div class="keys" style="margin-top:40px;">
      <span class="key">⌘</span><span class="key">⇧</span><span class="key">F</span>
      <span class="key-text">Search everything</span>
    </div>
  </div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-en-light.png" alt="">
  </div>
</div>
</body>
</html>
