<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pastable · 15s demo</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body class="demo">
<div class="stage">
  <div class="brand">
    <span>Pastable</span><span>15 SEC</span>
  </div>

  <div class="doc">
    <div class="doc-bar">
      <span class="traffic"><i></i><i></i><i></i></span>
      <span class="doc-name">Q4 发布计划.md</span>
      <span class="doc-state"><i></i><span id="doc-state-text">已保存</span></span>
    </div>
    <div class="doc-body">
      <p class="doc-kicker">Q4 LAUNCH / DRAFT 03</p>
      <p class="doc-h" id="doc-title">发布计划</p>
      <p class="doc-meta">最后编辑 2 分钟前 · 只有你可见</p>
      <div class="doc-rule"></div>
      <p class="doc-p" id="doc-summary-line"><span class="typed">备注：发布前再跑一遍 3 秒测试，确认第一张截图能一眼看懂。</span><span class="pasted">呼出即贴，不打断手头工作。</span><span class="caret"></span></p>
      <p class="doc-p" style="margin-top:14px;"><strong id="doc-week">本周</strong></p>
      <ul class="doc-list">
        <li class="done" id="doc-li-1">首屏文案：不打断手头工作</li>
        <li id="doc-li-2">周四前提交 1.2.1</li>
      </ul>
    </div>
  </div>

  <div class="demo-caption"><i></i>① 随手呼出，工作没停</div>

  <div class="demo-keys">
    <span class="key">⌘</span><span class="key">⇧</span><span class="key">V</span>
    <span class="key-text">呼出</span>
  </div>

  <div class="callout"><i></i>键盘焦点还在这里</div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-dark.png" alt="">
    <div class="selection"></div>
    <div class="enter-key">↵ Enter</div>
  </div>
</div>
</body>
</html>
