<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pastable · App Store screenshot 02 (ja)</title>
<link rel="stylesheet" href="marketing.css">
</head>
<body class="ja collection">
<div class="stage">
  <div class="watermark" aria-hidden="true">P</div>

  <div class="brand">
    <img src="../../Pastable/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png" alt="">
    <span>Pastable</span><span>MACOS</span>
  </div>

  <div class="copy">
    <p class="eyebrow">ひとつも失わない · 5種類を自動分類</p>
    <h1>ひとつも失わない。</h1>
    <p class="sub">テキスト、コード、リンク、画像、ファイルを自動分類。キーワードひとつで、いつでも取り戻せます。</p>
    <div class="chips">
      <span class="chip text"><i></i>テキスト</span>
      <span class="chip code"><i></i>コード</span>
      <span class="chip link"><i></i>リンク</span>
      <span class="chip media"><i></i>画像</span>
      <span class="chip file"><i></i>ファイル</span>
    </div>
    <div class="keys" style="margin-top:40px;">
      <span class="key">⌘</span><span class="key">⇧</span><span class="key">F</span>
      <span class="key-text">全文を検索</span>
    </div>
  </div>

  <div class="panel">
    <img src="../../docs/appstore/screenshots/raw/panel-ja-light.png" alt="">
  </div>
</div>
</body>
</html>
