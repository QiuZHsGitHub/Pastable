<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 · Pastable</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(900px 520px at 72% -8%, rgba(224,82,59,.1), transparent 62%),
        #f6f1e9;
      color: #1b1816;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .nav { width: min(1120px, calc(100% - 48px)); margin: 0 auto; padding: 22px 0; display: flex; align-items: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; text-decoration: none; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    main { display: grid; place-items: center; padding: 48px 24px 80px; text-align: center; }
    .code { font-family: "Songti SC", "Noto Serif SC", STSong, serif; font-size: clamp(84px, 18vw, 180px); line-height: 1; color: #c8402e; letter-spacing: .02em; }
    h1 { margin: 12px 0 0; font-family: "Songti SC", "Noto Serif SC", STSong, serif; font-weight: 600; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.35; }
    p { max-width: 460px; margin: 18px auto 0; color: #5c554c; font-size: 15px; line-height: 1.9; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }
    .btn { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border: 1px solid rgba(27,24,22,.22); border-radius: 100px; font-size: 14px; text-decoration: none; background: rgba(255,253,251,.55); }
    .btn.primary { background: #1b1816; border-color: #1b1816; color: #f6f1e9; }
    .btn:hover { opacity: .86; }
    footer { padding: 24px; text-align: center; font-size: 12px; color: #8e867d; }
    @media (prefers-reduced-motion: no-preference) {
      .code { animation: settle .7s cubic-bezier(.22,1,.36,1) both; }
      @keyframes settle { from { opacity: 0; transform: translateY(12px); } }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <a class="brand" href="/Pastable/">
        <img src="/Pastable/assets/site/icon-64.png" alt="">
        <span>Pastable</span>
      </a>
    </div>
  </header>

  <main>
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>这一页不在历史里。</h1>
      <p>也许它被清理掉了，或者链接拼错了。回到首页，继续找回你复制过的内容。</p>
      <div class="actions">
        <a class="btn primary" href="/Pastable/">回到首页</a>
        <a class="btn" href="/Pastable/support.html">技术支持</a>
      </div>
    </div>
  </main>

  <footer>© 2026 Qiu ZH · Pastable</footer>
</body>
</html>
